# Trusted Publishing via GitHub Actions OIDC（无需 NPM_TOKEN）
# 前置：在每个要发布的包的 npm Settings → Trusted Publisher 中配置：
#   owner: lynshir
#   repo: jumai-utils
#   workflow: publish.yml
#   并允许 npm publish
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Resolve npm dist-tag
        id: npm_tag
        run: |
          VERSION="$(node -p "require('./packages/jumai-utils/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if echo "${VERSION}" | grep -Eq 'alpha|beta|rc'; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish packages
        run: pnpm publish -r --no-git-checks --access public --tag "${{ steps.npm_tag.outputs.tag }}"
